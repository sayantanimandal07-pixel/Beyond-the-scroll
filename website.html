<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond the Scroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ec;--bg2:#f1ecfa;--card:#fffdf8;--ink:#14213d;--mute:#56607a;--line:#14213d1f;--blue:#8fb8f0;--lav:#b9a7ec;--acc:#3b4fd6;--sh:0 10px 30px #14213d14;--fs:1.1rem}
:root[data-t=dark]{--bg:#0e1426;--bg2:#171b36;--card:#161d36;--ink:#eef0fa;--mute:#a4abc6;--line:#eef0fa26;--blue:#4a6fb5;--lav:#6a58b8;--acc:#9db4ff;--sh:0 10px 30px #0006}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 Figtree,system-ui,sans-serif;transition:background .3s}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;line-height:1.1;margin:0}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;gap:6px;height:64px;flex-wrap:wrap}
.logo{font:800 1.3rem Fraunces,serif;text-decoration:none;margin-right:auto}
nav a.l{padding:8px 12px;border-radius:99px;text-decoration:none;font-weight:500;color:var(--mute)}
nav a.l:hover,nav a.l.on{background:var(--bg2);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:99px;cursor:pointer;font-weight:600;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh)}.btn:active{transform:scale(.96)}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#menu{display:none}
@media(max-width:760px){#menu{display:block}nav .links{display:none;width:100%;flex-direction:column;padding-bottom:10px}nav .links.open{display:flex}nav{height:auto;padding:10px 0}}
nav .links{display:flex;gap:2px;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;padding:84px 0 70px;background:linear-gradient(120deg,var(--bg2),var(--bg),var(--bg2));background-size:200% 200%;animation:g 14s ease infinite}
@keyframes g{50%{background-position:100% 50%}}
.orb{position:absolute;border-radius:50%;filter:blur(50px);opacity:.55;pointer-events:none}
.hero h1{font-size:clamp(2.6rem,8vw,6rem);font-weight:800;letter-spacing:-.03em;max-width:12ch;position:relative}
#rot{color:var(--acc);display:inline-block;transition:opacity .4s,transform .4s}
.hero p{max-width:46ch;color:var(--mute);font-size:1.15rem;position:relative}
section{padding:46px 0}section h2{font-size:clamp(1.7rem,4vw,2.4rem);margin-bottom:6px}
.sub{color:var(--mute);margin:0 0 22px}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);box-shadow:var(--sh)}
.card .im{overflow:hidden;aspect-ratio:16/10}.card .im svg{width:100%;height:100%;display:block;transition:transform .5s}.card:hover .im svg{transform:scale(1.08)}
.card .b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.25rem}.card p{margin:0;color:var(--mute);font-size:.95rem}
.meta{font-size:.82rem;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.tag{background:var(--bg2);border-radius:99px;padding:2px 10px;font-weight:600;font-size:.78rem;color:var(--acc);width:max-content}
.feat{display:grid;grid-template-columns:1.2fr 1fr;border-radius:28px;min-height:360px}
.feat .im{aspect-ratio:auto;height:100%}.feat h3{font-size:clamp(1.7rem,3.5vw,2.6rem)}
@media(max-width:760px){.feat{grid-template-columns:1fr}.feat .im{aspect-ratio:16/10}}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.chip{padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;transition:all .2s}
.chip:hover{transform:translateY(-2px)}.chip[aria-pressed=true]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.two{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.box blockquote{font:600 1.5rem/1.3 Fraunces,serif;margin:8px 0}
input,select,textarea{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);margin:4px 0}
label{font-weight:600;font-size:.9rem}.err{color:#c0392b;font-size:.85rem;min-height:1.2em}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.bar input{flex:1;min-width:200px;margin:0}.bar select{width:auto;margin:0}
.empty{text-align:center;padding:50px 20px;color:var(--mute);border:2px dashed var(--line);border-radius:20px}
#prog{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--lav),var(--acc));width:0;z-index:50}
.art{display:grid;grid-template-columns:200px minmax(0,680px);gap:40px;justify-content:center}
@media(max-width:900px){.art{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:90px;align-self:start;font-size:.9rem}.toc a{display:block;padding:5px 0;color:var(--mute);text-decoration:none}.toc a:hover{color:var(--acc)}
.prose{font-size:var(--fs);line-height:1.8}.prose h2{font-size:1.7rem;margin:2em 0 .5em}.prose p{margin:0 0 1.2em}
.focus header,.focus footer,.focus .toc,.focus .rel{display:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.bm svg{transition:transform .3s}.bm.on svg{fill:var(--acc);transform:scale(1.25) rotate(-8deg)}
.rx button{margin:0 8px 8px 0}.rx .on{background:var(--acc);color:var(--bg)}
.cm{border-top:1px solid var(--line);padding:12px 0}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,100px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;transition:transform .35s;z-index:99}
#toast.show{transform:translate(-50%,0)}
footer{border-top:1px solid var(--line);padding:34px 0;color:var(--mute);margin-top:40px}
footer .wrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between}
.cur{position:fixed;width:26px;height:26px;border:2px solid var(--acc);border-radius:50%;pointer-events:none;z-index:100;transition:transform .15s;opacity:0}
@media(hover:none),(pointer:coarse){.cur{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="prog"></div><div class="cur" id="cur"></div><div id="toast" role="status" aria-live="polite"></div>
<header><div class="wrap"><nav aria-label="Main">
<a class="logo" href="#/">Beyond the Scroll</a>
<button class="btn" id="menu" aria-expanded="false" aria-label="Toggle menu">Menu</button>
<div class="links" id="links">
<a class="l" href="#/">Home</a><a class="l" href="#/explore">Explore</a><a class="l" href="#/categories">Categories</a><a class="l" href="#/bookmarks">Saved</a><a class="l" href="#/about">About</a><a class="l" href="#/contact">Contact</a></div>
<button class="btn" id="theme" aria-label="Toggle dark mode">Theme</button>
</nav></div></header>
<main id="app" class="wrap" tabindex="-1" style="max-width:none;padding:0"></main>
<footer><div class="wrap"><div><b class="serif">Beyond the Scroll</b><br>Stories for slower, braver reading.</div>
<div><a href="#/explore">Explore</a> · <a href="#/categories">Categories</a> · <a href="#/contact">Contact</a></div>
<div><a href="https://github.com" target="_blank" rel="noopener">GitHub</a> · <a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a> · <a href="https://linkedin.com" target="_blank" rel="noopener">LinkedIn</a> (replace with yours)</div></div></footer>

<script>
const A=[
{id:'romanticize',t:'The Art of Romanticizing Your Ordinary Days',c:'Lifestyle',tags:['mindfulness','routine'],d:'2026-09-28',p:94,m:5,s:'A Tuesday can feel like a film scene if you decide to notice it.',b:['I started with a chipped blue mug. Same mug, same kitchen, but one morning I sat down with it and watched the steam instead of my phone. Nothing happened, and it was lovely.','## Pick one ritual','Romanticizing is not pretending life is perfect. It is choosing a detail and giving it your full attention. Pour tea slowly. Play one album start to finish on the walk home.','## Make the setting do some work','Light a lamp instead of the ceiling bulb. Write the date on your notebook page like it matters. Small staging tells your brain this hour counts.','## Keep the ordinary ordinary','You are not curating for anyone. If a day is dull, let it be dull with good music on.']},
{id:'college',t:'Things Nobody Tells You About Being a College Student',c:'Student Life',tags:['college','growth'],d:'2026-09-24',p:98,m:6,s:'Nobody mentions the lonely first month, or how fast it passes.',b:['Everyone sells college as the best years of your life. Nobody mentions eating dinner alone in week two and wondering if you chose wrong.','## Friendship is slow','Real friends tend to appear after the fifth shared study session, not the first party. Show up repeatedly to the same places.','## Grades are not your personality','You will bomb something. A single low mark rarely matters; the habit of asking for help matters enormously.','## Office hours are free coaching','Professors remember the student who came with a specific question. Go with one.']},
{id:'twenties',t:'Your 20s Are Not a Race Against Time',c:'Self-Growth',tags:['life','career'],d:'2026-09-19',p:91,m:5,s:'The timeline in your head was borrowed from people you barely know.',b:['At 22 I kept a mental scoreboard: who was engaged, promoted, abroad. I was losing a game nobody had agreed to play.','## Comparison compresses stories','You see their announcement, not their three years of doubt. Your highlight reel is just as edited.','## Detours are data','The job you hated taught you what you refuse to tolerate. That is useful information, not wasted time.','## A smaller question','Instead of asking whether you are behind, ask what you want to be better at by next spring.']},
{id:'failure',t:'What If Your Biggest Failure Is Your Best Beginning?',c:'Self-Growth',tags:['failure','resilience'],d:'2026-09-14',p:88,m:4,s:'The project that collapsed might be the one that taught you everything.',b:['My first app had 3 users: my mother, my roommate, and a bot. It also taught me more than any course.','## Failure gives specifics','Success says "good job." Failure says exactly which assumption was wrong, and that is rarer feedback.','## Write the post-mortem','Three questions: what did I expect, what happened, what will I change? Ten minutes, one page, then move on.']},
{id:'procrastinate',t:'The Psychology Behind Why We Procrastinate',c:'Mind',tags:['psychology','focus'],d:'2026-09-09',p:96,m:6,s:'It is not laziness. It is an emotion-management problem in disguise.',b:['Researchers increasingly describe procrastination as avoiding a feeling, not a task. The essay is not hard; the anxiety about doing it badly is.','## Shrink the first step','"Write the essay" is a threat. "Open the document and type one ugly sentence" is not.','## Name the feeling','Boredom, fear, confusion each need a different fix. Ask which one is sitting on your chest.','## Be kind about it','Self-punishment makes avoidance worse. Self-compassion consistently predicts getting started sooner.']},
{id:'techproject',t:"A Beginner's Guide to Building Your First Tech Project",c:'Technology',tags:['coding','beginners'],d:'2026-09-04',p:93,m:7,s:'Skip the tutorial maze. Build something small that you will actually use.',b:['Tutorial hell is real: you can follow along for months and still freeze before an empty file.','## Choose a problem you have','A tracker for your gym sets. A bot that reminds you to water plants. Personal stakes keep you going.','## Define done in one sentence','"It lets me add a plant and shows when to water it." Anything else is version two.','## Ship it ugly','Put it online by the weekend. Feedback from one real user beats a month of polishing.']},
{id:'littlethings',t:'Little Things That Make Life Feel Beautiful Again',c:'Lifestyle',tags:['gratitude','joy'],d:'2026-08-30',p:85,m:3,s:'A short list of small, almost silly pleasures worth protecting.',b:['Fresh sheets. A stranger holding a door. The first sip of something warm when it is raining.','## Why they work','Small pleasures are cheap, repeatable, and immune to comparison. Nobody can rank your favorite window seat.','## Start a list','Keep a note called "Good things." Add one line a day. In a month you will have evidence against bad days.']},
{id:'loud',t:'The Internet Is Loud. Learn to Think for Yourself.',c:'Ideas',tags:['media','thinking'],d:'2026-08-25',p:97,m:6,s:'Opinions arrive pre-chewed. Here is how to taste your own.',b:['Most of what feels like your opinion arrived in a feed, repeated until it felt familiar.','## Delay your reaction','Wait one day before sharing a take. Many strong feelings fade; the ones that stay are worth examining.','## Read the opposite side at its best','Find the smartest defender of the view you dislike. Either you change your mind or you understand yours better.','## Own fewer opinions','"I do not know yet" is a respectable position and a rare one.']},
{id:'habit',t:'How to Build a Habit When Motivation Disappears',c:'Self-Growth',tags:['habits','discipline'],d:'2026-08-20',p:90,m:5,s:'Motivation is weather. Systems are the house you live in.',b:['Day four of a new routine, the excitement is gone and the alarm sounds rude.','## Make it embarrassingly small','Two push-ups. One page. The goal is to keep the identity alive: you are someone who shows up.','## Attach it to something','After coffee, I stretch. Existing anchors do the remembering for you.','## Plan for the bad day','Decide in advance what the minimum version is. Missing once is fine; missing twice is a new habit.']},
{id:'letters',t:'Letters to the Person You Are Becoming',c:'Personal',tags:['journaling','reflection'],d:'2026-08-15',p:82,m:4,s:'Dear future me: I hope you kept the good parts.',b:['Dear future me, I am writing this on a bus with 11% battery and a head full of maybes.','## What I hope you remember','That you were scared and went anyway. That you called your grandmother more than felt necessary.','## What I hope you let go','The need to be impressive. The playlist you keep for sad moods you have outgrown.','Write your own, seal it, and open it in a year.']},
{id:'curiosity',t:'Why Curiosity Is More Powerful Than Intelligence',c:'Mind',tags:['learning','curiosity'],d:'2026-08-10',p:89,m:5,s:'Smart people stop at the answer. Curious people ask the next question.',b:['Intelligence is what you bring to a problem. Curiosity decides whether you stay with it.','## Curiosity compounds','Each answer opens more doors. After five years the curious person knows more, simply because they kept knocking.','## Ask better questions','Swap "why is this boring?" for "who finds this fascinating, and why?"','## Protect it','Leave unscheduled time. Curiosity needs wandering room.']},
{id:'detox',t:'A Digital Detox Without Disappearing From the World',c:'Technology',tags:['wellbeing','phone'],d:'2026-08-05',p:95,m:6,s:'You do not need a cabin. You need a few friction points.',b:['Deleting every app lasted two days. What worked was making scrolling slightly annoying.','## Add friction','Log out after each session. Move social apps off the home screen. Grayscale after 9 p.m.','## Replace, do not just remove','Put a paperback where your phone usually sits on the nightstand.','## Keep the useful parts','Maps, messages from family, music. The goal is intention, not purity.']}];
const CATS={Lifestyle:'☕',  'Student Life':'🎓','Self-Growth':'🌱',Mind:'🧠',Technology:'💻',Ideas:'💡',Personal:'✉️'};
const MOODS={Curious:['curiosity','techproject','procrastinate'],Inspired:['failure','twenties','habit'],Thoughtful:['loud','letters','detox'],Creative:['romanticize','littlethings','techproject'],Adventurous:['college','twenties','failure']};
const QUOTES=['The unexamined feed is not worth scrolling.','Be a student of the small moments.','Slow is a speed, too.','Your attention is the only thing you spend that you cannot earn back.'];
const QOTD='What is one thing you started doing this year that you are proud of?';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const ls={g:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=id=>A.find(a=>a.id===id);
const fmt=d=>new Date(d).toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('show'),2400)}
// Generative cover art (replace with <img src="..."> per article for real photos)
function cover(a){let h=0;for(const ch of a.id)h=(h*31+ch.charCodeAt(0))>>>0;const r=n=>{h=(h*1103515245+12345)>>>0;return h%n};
const pal=[['#8fb8f0','#b9a7ec','#fbf6ec','#14213d'],['#b9a7ec','#f6c9d8','#e9f0ff','#3b4fd6'],['#a6d4f2','#fbe3b8','#f1ecfa','#14213d']][r(3)];
let s=`<svg viewBox="0 0 400 250" role="img" aria-label="Abstract artwork for ${esc(a.t)}" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g${a.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${pal[0]}"/><stop offset="1" stop-color="${pal[1]}"/></linearGradient></defs><rect width="400" height="250" fill="url(#g${a.id})"/>`;
for(let i=0;i<5;i++)s+=`<circle cx="${r(400)}" cy="${r(250)}" r="${30+r(80)}" fill="${[pal[2],pal[3],'#fff'][i%3]}" opacity="${(.12+r(25)/100).toFixed(2)}"/>`;
s+=`<path d="M0 ${170+r(40)} Q 100 ${120+r(60)} 200 ${170+r(40)} T 400 ${160+r(40)} V250 H0Z" fill="${pal[3]}" opacity=".18"/><text x="24" y="226" font-size="44" >${CATS[a.c]||'✦'}</text></svg>`;return s}
function card(a,cls=''){return `<a class="card ${cls}" href="#/article/${a.id}"><div class="im">${cover(a)}</div><div class="b"><span class="tag">${esc(a.c)}</span><h3>${esc(a.t)}</h3><p>${esc(a.s)}</p><div class="meta"><span>Maya Rao</span><span>${fmt(a.d)}</span><span>${a.m} min read</span></div></div></a>`}
const bms=()=>ls.g('bms',[]);
// Router
const app=$('#app');
function route(){const [_,p,id]=(location.hash||'#/').split('/');document.body.classList.remove('focus');$('#prog').style.width=0;
$$('nav a.l').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/'+(p||'')));$('#links').classList.remove('open');
const v={'':home,explore,categories,bookmarks,about,contact,article:()=>article(id)}[p||''];(v||nf)(id);window.scrollTo(0,0);app.focus({preventScroll:true})}
const nf=()=>app.innerHTML=`<div class="wrap"><div class="empty"><h2>That page wandered off</h2><p>Check the link or head <a href="#/">home</a>.</p></div></div>`;
addEventListener('hashchange',route);
// Home
function home(){const f=A[0],trend=[...A].sort((x,y)=>y.p-x.p).slice(0,3),recent=[...A].sort((x,y)=>y.d.localeCompare(x.d)).slice(0,6);
const last=ls.g('last',null),streak=ls.g('streak',{n:0,d:''}),read=ls.g('read',[]);
app.innerHTML=`<div class="hero"><div class="orb" style="width:340px;height:340px;background:var(--lav);right:-60px;top:-40px"></div><div class="orb" style="width:260px;height:260px;background:var(--blue);left:30%;bottom:-120px"></div>
<div class="wrap"><h1>Read something that makes you <span id="rot">pause</span>.</h1><p>Essays on student life, growth, technology and the quiet art of paying attention.</p>
<p style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn p" href="#/explore">Start reading</a><button class="btn" id="surp">Surprise me</button></p></div></div>
<div class="wrap"><section><div class="card feat">${card(f,'').replace('class="card "','class="x"').replace(/^<a class="x"/,'<a style="display:contents;text-decoration:none"')}</div></section>
${last&&get(last.id)?`<section style="padding-top:0"><div class="box"><b>Continue where you left off</b><p style="margin:4px 0 10px"><a href="#/article/${last.id}">${esc(get(last.id).t)}</a> (${Math.round(last.pct)}% read)</p></div></section>`:''}
<section><h2>Choose your mood</h2><p class="sub">Tell us how you feel; we will pick the reads.</p><div class="chips" id="moods">${Object.keys(MOODS).map(m=>`<button class="chip" aria-pressed="false">${m}</button>`).join('')}</div><div class="grid" id="mres"></div></section>
<section><h2>Trending now</h2><p class="sub">Most-read this month.</p><div class="grid">${trend.map(a=>card(a)).join('')}</div></section>
<section><h2>Fresh off the press</h2><p class="sub">Recently published.</p><div class="grid">${recent.map(a=>card(a)).join('')}</div></section>
<section><div class="two"><div class="box"><b>Daily thought</b><blockquote id="dt">${QUOTES[new Date().getDate()%QUOTES.length]}</blockquote></div>
<div class="box"><b>Your reading streak</b><p class="serif" style="font-size:2.4rem;margin:6px 0">${streak.n} day${streak.n===1?'':'s'}</p><p class="sub" style="margin:0">${read.length} of ${A.length} stories read. Stored in this browser only.</p></div></div></section>
<section><div class="two"><div class="box"><b>Question of the day</b><p class="serif" style="font-size:1.3rem">${QOTD}</p><form id="qf" novalidate><textarea id="qa" rows="3" aria-label="Your answer" maxlength="400"></textarea><div class="err" id="qe"></div><button class="btn p">Save my answer</button></form><div id="qs"></div></div>
<div class="box"><b>Which topics fit you?</b><div id="quiz"></div></div></div></section>
<section><div class="box"><h2>Newsletter</h2><p class="sub">One story, once a week.</p><div id="nl"></div></div></section></div>`;
const words=['pause','wonder','begin','breathe','think'];let i=0;clearInterval(window.rt);window.rt=setInterval(()=>{const r=$('#rot');if(!r)return clearInterval(window.rt);r.style.opacity=0;r.style.transform='translateY(8px)';setTimeout(()=>{r.textContent=words[++i%words.length];r.style.opacity=1;r.style.transform=''},400)},2600);
$('#surp').onclick=()=>location.hash='#/article/'+A[Math.floor(Math.random()*A.length)].id;
$$('#moods .chip').forEach(b=>b.onclick=()=>{$$('#moods .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#mres').innerHTML=MOODS[b.textContent].map(id=>card(get(id))).join('')});
const sa=ls.g('qotd',{});if(sa.date===new Date().toDateString())$('#qs').innerHTML=`<p class="tag">Saved on this device: ${esc(sa.v)}</p>`;
$('#qf').onsubmit=e=>{e.preventDefault();const v=$('#qa').value.trim();if(v.length<3){$('#qe').textContent='Write at least 3 characters.';return}ls.s('qotd',{date:new Date().toDateString(),v});$('#qe').textContent='';$('#qs').innerHTML=`<p class="tag">Saved on this device: ${esc(v)}</p>`;toast('Answer saved locally')};
quiz();nl($('#nl'))}
function quiz(){const Q=[['Weekend plan?',[['Build something','Technology'],['Journal and tea','Lifestyle'],['Read about ideas','Ideas']]],['What do you want more of?',[['Focus','Mind'],['Direction','Self-Growth'],['Friends and fun','Student Life']]]];let i=0,sc=[];const box=$('#quiz');
(function show(){if(i>=Q.length){const top=sc.sort((a,b)=>sc.filter(x=>x===b).length-sc.filter(x=>x===a).length)[0];box.innerHTML=`<p>Start with <b>${top}</b>.</p><a class="btn p" href="#/categories/${encodeURIComponent(top)}">See ${top} stories</a>`;return}
box.innerHTML=`<p class="serif" style="font-size:1.2rem">${Q[i][0]}</p>`+Q[i][1].map((o,k)=>`<button class="chip" style="display:block;margin:6px 0" data-k="${k}">${o[0]}</button>`).join('');
$$('button',box).forEach(b=>b.onclick=()=>{sc.push(Q[i][1][b.dataset.k][1]);i++;show()})})()}
function nl(el){el.innerHTML=`<form novalidate style="max-width:420px"><label for="ne">Email</label><input id="ne" type="email" autocomplete="email"><div class="err"></div><button class="btn p">Subscribe</button></form><p class="sub" style="font-size:.85rem;margin-top:8px">Demo: no server is connected, so this only saves your email in this browser. No emails are sent.</p>`;
$('form',el).onsubmit=e=>{e.preventDefault();const v=$('#ne').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){$('.err',el).textContent='Enter a valid email like name@example.com.';return}ls.s('subs',[...ls.g('subs',[]),v]);$('.err',el).textContent='';el.innerHTML='<p><b>Saved locally.</b> Connect a backend to send real newsletters.</p>';toast('Email saved on this device')}}
// Explore
function explore(){app.innerHTML=`<div class="wrap"><section><h1 class="serif" style="font-size:clamp(2rem,6vw,3.5rem)">Explore</h1><p class="sub">Search titles, tags and topics.</p>
<div class="bar"><input id="q" type="search" placeholder="Search stories" aria-label="Search stories"><select id="cf" aria-label="Category"><option value="">All categories</option>${Object.keys(CATS).map(c=>`<option>${c}</option>`).join('')}</select><select id="so" aria-label="Sort"><option value="n">Newest</option><option value="p">Most popular</option><option value="s">Shortest read</option></select></div><div class="grid" id="res"></div></section></div>`;
const pre=decodeURIComponent((location.hash.split('/')[2])||'');if(pre)$('#cf').value=pre;
const run=()=>{const q=$('#q').value.toLowerCase(),c=$('#cf').value,so=$('#so').value;
let r=A.filter(a=>(!c||a.c===c)&&(!q||[a.t,a.s,a.c,...a.tags].join(' ').toLowerCase().includes(q)));
r.sort((x,y)=>so==='p'?y.p-x.p:so==='s'?x.m-y.m:y.d.localeCompare(x.d));
$('#res').innerHTML=r.length?r.map(a=>card(a)).join(''):`<div class="empty" style="grid-column:1/-1"><h3>No stories match "${esc(q)}"</h3><p>Try a broader word, or clear the category filter.</p></div>`};
['input','change'].forEach(e=>app.addEventListener(e,ev=>{if(ev.target.closest('.bar'))run()}));run()}
function categories(){app.innerHTML=`<div class="wrap"><section><h1 class="serif" style="font-size:clamp(2rem,6vw,3.5rem)">Categories</h1><p class="sub">Pick a shelf.</p><div class="grid">${Object.keys(CATS).map(c=>`<a class="card" href="#/explore/${encodeURIComponent(c)}"><div class="b" style="padding:28px"><span style="font-size:2.4rem">${CATS[c]}</span><h3>${c}</h3><p>${A.filter(a=>a.c===c).length} stories</p></div></a>`).join('')}</div></section></div>`}
function bookmarks(){const l=bms().map(get).filter(Boolean);app.innerHTML=`<div class="wrap"><section><h1 class="serif" style="font-size:clamp(2rem,6vw,3.5rem)">Saved</h1><p class="sub">Stored in this browser.</p>${l.length?`<div class="grid">${l.map(a=>card(a)).join('')}</div>`:`<div class="empty"><h3>Nothing saved yet</h3><p>Tap Save on any story and it will wait for you here. <a href="#/explore">Find a story</a></p></div>`}</section></div>`}
function about(){app.innerHTML=`<div class="wrap"><section><div class="two" style="align-items:center"><div class="card" style="border-radius:28px">${cover({id:'maya',t:'Author portrait',c:'Personal'})}</div><div><h1 class="serif" style="font-size:clamp(2rem,6vw,3.5rem)">Hi, I am Maya.</h1><p>I write about being young, curious and slightly overwhelmed. This site began as a notebook and grew into a place for slower reading.</p><p><span class="tag">Writing</span> <span class="tag">Tech</span> <span class="tag">Travel</span> <span class="tag">Psychology</span></p><p><a href="#/contact">Write to me</a> · replace this bio and the portrait with your own.</p></div></div></section></div>`}
function contact(){app.innerHTML=`<div class="wrap" style="max-width:640px"><section><h1 class="serif" style="font-size:2.6rem">Contact</h1><p class="sub">Demo form: messages are saved in this browser only, not sent.</p><form id="cf" novalidate><label for="cn">Name</label><input id="cn"><div class="err"></div><label for="ce">Email</label><input id="ce" type="email"><div class="err"></div><label for="cm">Message</label><textarea id="cm" rows="5"></textarea><div class="err"></div><button class="btn p">Save message</button></form></section></div>`;
$('#cf').onsubmit=e=>{e.preventDefault();const f=[$('#cn'),$('#ce'),$('#cm')],er=$$('#cf .err');let ok=true;
const chk=[[f[0].value.trim().length>=2,'Enter your name.'],[/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f[1].value),'Enter a valid email.'],[f[2].value.trim().length>=10,'Write at least 10 characters.']];
chk.forEach((c,i)=>{er[i].textContent=c[0]?'':c[1];if(!c[0])ok=false});if(!ok)return;
ls.s('msgs',[...ls.g('msgs',[]),{n:f[0].value,e:f[1].value,m:f[2].value}]);e.target.reset();toast('Message saved locally (not sent)')}}
// Article
function article(id){const a=get(id);if(!a)return nf();const saved=bms().includes(id),rx=ls.g('rx:'+id,[]);let toc=[],html='';
a.b.forEach(p=>{if(p.startsWith('## ')){const t=p.slice(3),k='s'+toc.length;toc.push([k,t]);html+=`<h2 id="${k}">${esc(t)}</h2>`}else html+=`<p>${esc(p)}</p>`});
const rel=A.filter(x=>x.id!==id&&(x.c===a.c||x.tags.some(t=>a.tags.includes(t)))).slice(0,3);
app.innerHTML=`<div class="wrap"><section><a href="#/explore">&larr; All stories</a><div class="art" style="margin-top:20px"><nav class="toc" aria-label="Table of contents"><b>In this story</b>${toc.map(t=>`<a href="#" data-k="${t[0]}">${esc(t[1])}</a>`).join('')||'<span style="color:var(--mute)">Short read</span>'}</nav>
<article><span class="tag">${a.c}</span><h1 style="font-size:clamp(2rem,5vw,3.2rem);margin:12px 0">${esc(a.t)}</h1><div class="meta" style="margin:0">By Maya Rao · ${fmt(a.d)} · ${a.m} min read · ${a.tags.map(t=>'#'+t).join(' ')}</div>
<div class="card" style="margin:20px 0;border-radius:20px">${cover(a)}</div>
<div class="tools"><button class="btn bm ${saved?'on':''}" id="bm" aria-pressed="${saved}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg> ${saved?'Saved':'Save'}</button><button class="btn" id="cp">Copy link</button><button class="btn" id="sh">Share</button><button class="btn" id="fm1" aria-label="Smaller text">A-</button><button class="btn" id="fm2" aria-label="Larger text">A+</button><button class="btn" id="fc" aria-pressed="false">Focus mode</button></div>
<div class="prose">${html}</div>
<div class="box rx" style="margin-top:30px"><b>How did it land?</b><div style="margin-top:10px">${['Helpful','Inspiring','Thought-provoking','Loved it'].map(r=>`<button class="chip ${rx.includes(r)?'on':''}" aria-pressed="${rx.includes(r)}">${r}</button>`).join('')}</div></div>
<div style="margin-top:30px"><h3>Comments</h3><p class="sub" style="font-size:.85rem">Demo: comments are saved in this browser only, so only you can see them.</p><form id="cmf" novalidate><label for="an">Name</label><input id="an" maxlength="40"><label for="ac">Comment</label><textarea id="ac" rows="3" maxlength="500"></textarea><div class="err" id="ae"></div><button class="btn p">Post comment</button></form><div id="cl"></div></div></article></div></section>
<section class="rel"><div class="wrap"><h2>Keep reading</h2><div class="grid">${rel.map(x=>card(x)).join('')}</div></div></section></div>`;
const root=document.documentElement;root.style.setProperty('--fs',ls.g('fs',1.1)+'rem');
$('#bm').onclick=function(){let l=bms();const on=!l.includes(id);l=on?[...l,id]:l.filter(x=>x!==id);ls.s('bms',l);this.classList.toggle('on',on);this.setAttribute('aria-pressed',on);this.lastChild.textContent=on?' Saved':' Save';toast(on?'Saved to your list':'Removed from saved')};
$('#cp').onclick=()=>navigator.clipboard?.writeText(location.href).then(()=>toast('Link copied'),()=>toast('Copy failed. Copy it from the address bar.'));
$('#sh').onclick=()=>navigator.share?navigator.share({title:a.t,url:location.href}).catch(()=>{}):$('#cp').click();
const sz=d=>{const v=Math.min(1.5,Math.max(.9,ls.g('fs',1.1)+d));ls.s('fs',v);root.style.setProperty('--fs',v+'rem')};$('#fm1').onclick=()=>sz(-.1);$('#fm2').onclick=()=>sz(.1);
$('#fc').onclick=function(){const on=document.body.classList.toggle('focus');this.setAttribute('aria-pressed',on);this.textContent=on?'Exit focus':'Focus mode'};
$$('.toc a[data-k]').forEach(l=>l.onclick=e=>{e.preventDefault();document.getElementById(l.dataset.k).scrollIntoView({behavior:'smooth'})});
$$('.rx .chip').forEach(b=>b.onclick=()=>{let r=ls.g('rx:'+id,[]);const on=!r.includes(b.textContent);r=on?[...r,b.textContent]:r.filter(x=>x!==b.textContent);ls.s('rx:'+id,r);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);if(on)toast('Thanks for the feedback')});
const cl=()=>$('#cl').innerHTML=ls.g('c:'+id,[]).map(c=>`<div class="cm"><b>${esc(c.n)}</b> <span style="color:var(--mute);font-size:.85rem">${c.t}</span><p style="margin:4px 0">${esc(c.c)}</p></div>`).join('');cl();
$('#cmf').onsubmit=e=>{e.preventDefault();const n=$('#an').value.trim(),c=$('#ac').value.trim();if(n.length<2||c.length<5){$('#ae').textContent='Add your name and a comment of at least 5 characters.';return}$('#ae').textContent='';ls.s('c:'+id,[{n,c,t:new Date().toLocaleDateString()},...ls.g('c:'+id,[])]);e.target.reset();cl();toast('Comment saved on this device')};
// progress + streak
const done=()=>{const r=ls.g('read',[]);if(!r.includes(id))ls.s('read',[...r,id]);const td=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString(),s=ls.g('streak',{n:0,d:''});if(s.d!==td)ls.s('streak',{n:s.d===y?s.n+1:1,d:td})};
window.onscroll=()=>{if(!location.hash.startsWith('#/article'))return;const e=$('.prose');if(!e)return;const r=e.getBoundingClientRect(),pct=Math.min(100,Math.max(0,(-r.top+innerHeight*.5)/r.height*100));$('#prog').style.width=pct+'%';ls.s('last',{id,pct});if(pct>=95)done()}}
// Theme, menu, cursor
const th=ls.g('theme',matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.t=th;
$('#theme').onclick=()=>{const n=document.documentElement.dataset.t==='dark'?'light':'dark';document.documentElement.dataset.t=n;ls.s('theme',n)};
$('#menu').onclick=function(){const o=$('#links').classList.toggle('open');this.setAttribute('aria-expanded',o)};
if(matchMedia('(hover:hover) and (pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches){const c=$('#cur');addEventListener('mousemove',e=>{c.style.opacity=1;c.style.left=e.clientX-13+'px';c.style.top=e.clientY-13+'px';c.style.transform=e.target.closest('a,button,.chip')?'scale(1.8)':''})}
route();
</script>
</body>
</html>
